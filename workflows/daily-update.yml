name: Daily CarrierCore Curriculum Refresh

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Daily Timestamp Log
        run: |
          echo "{\"last_updated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\", \"status\": \"Active\", \"engine\": \"CarrierCore Engine v1.0\"}" > daily-status.json

      - name: Commit & Push Daily Refresh
        run: |
          git config --global user.name "CarrierCore Daily Bot"
          git config --global user.email "bot@github-actions.local"
          git add daily-status.json
          git commit -m "chore(daily): Automated daily carrier curriculum refresh [$(date -u +"%Y-%m-%d")]" || echo "No changes to commit"
          git push
